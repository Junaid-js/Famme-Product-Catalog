services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: famme_catalog
      POSTGRES_USER: famme
      POSTGRES_PASSWORD: famme
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U famme -d famme_catalog"]
      interval: 2s
      timeout: 2s
      retries: 15
    volumes:
      - famme-postgres-data:/var/lib/postgresql

volumes:
  famme-postgres-data:
